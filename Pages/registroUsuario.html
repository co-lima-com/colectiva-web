      </ul>
      </nav>
    </header>
    <section>
      <form id="registrationForm" class="form-usuario">
        <fieldset>
          <legend class="encabezado-usuario">Registra tus Datos</legend>
          <div class="form-group">
            <label for="userNombre">Nombre:</label>
            <input
              id="userNombre"
              type="text"
              required
              placeholder="Escribe tu Nombre"
            />
          </div>
          <div class="form-group">
            <label for="userApellidoPaterno">Apellido Paterno:</label>
            <input
              id="userApellidoPaterno"
              type="text"
              required
              placeholder="Escribe tu Apellido Paterno"
            />
          </div>
          <div class="form-group">
            <label for="userApellidoMaterno">Apellido Materno:</label>
            <input
              id="userApellidoMaterno"
              type="text"
              required
              placeholder="Escribe tu Apellido Materno"
            />
          </div>
          <div class="form-group">
            <label for="userFechaNacimiento">Fecha de Nacimiento:</label>
            <input id="userFechaNacimiento" type="date" />
          </div>
          <div class="form-group">
            <label for="userDNI">DNI:</label>
            <input id="userDNI" type="number" />
          </div>
          <div class="form-group">
            <label for="userDireccion">Dirección:</label>
            <input
              id="userDireccion"
              type="text"
              placeholder="Ingresa tu Dirección"
            />
          </div>
          <div class="form-group">
            <label for="userEmail">Correo Electrónico:</label>
            <input
              id="userEmail"
              type="text"
              placeholder="Ingresa tu Dirección de Correo Electrónico"
            />
          </div>
          <div class="form-group">
            <label for="userPassword">Contraseña:</label>
            <input id="userPassword" type="password" />
          </div>
          <div class="form-group"></div>
          <button class="button-usuario" type="submit">Regístrate</button>
        </fieldset>
      </form>
    </section>
    <div class="whatsapp-button">
      <p class="parrafo-wsp">¿Necesitas ayuda?</p>
      <a href="https://wa.me/51956804564" target="_blank">
