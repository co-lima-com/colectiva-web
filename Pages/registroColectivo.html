<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/registroColectivo.css">
    <title>Colectiva</title>
</head>

<body>
    <header>
        <nav class="contenedor">
            <a href="../index.html">
                <img src="../img/banner.png" alt="" class="imagen" />
            </a>

            <ul class="botones">
                <li>
                    <a href="../Pages/registroUsuario.html" class="mi-botonEncabezado">
                        Registro
                    </a>
                </li>
                <li>
                    <a href="../Pages/inicioSesion.html" class="mi-botonEncabezado">
                        Inicia Sesión
                    </a>
                </li>
                <li>
                    <a href="../Pages/fichaColectivo.html" class="mi-botonEncabezado">
                        Programa tu Viaje
                    </a>
                </li>
                <li>
                    <a href="../Pages/registroConductor.html" class="mi-botonEncabezado">
                        Sé un Socio Conductor
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <section>
        <form id="registroColectivo" class="form-colectivo" action="">
            <fieldset>
                <legend class="encabezado-colectivo">Registra los Datos de tu Vehículo</legend>
                <div class="form-group">
                    <label for="poolMarca">Marca:</label>
                    <input id="poolMarca" type="text">
                </div>
                <div class="form-group">
                    <label for="poolYear">Año:</label>
                    <input id="poolYear" type="number">
                </div>
                <div class="form-group">
                    <label for="poolModelo">Modelo:</label>
                    <input id="poolModelo" type="text" placeholder="Ingresa el modelo del Vehículo">
                </div>
                <div class="form-group">
                    <label for="poolPlaca">Placa:</label>
                    <input id="poolPlaca" type="text" placeholder="Nro. de Placa">
                </div>
                <div class="form-group">
                    <label for="poolNumeroAsientos">Número de Asientos:</label>
                    <input id="poolNumeroAsientos" type="number">
                </div>
                <div class="form-group">
                    <label for="poolFoto1">Foto del Vehículo:</label>
                    <input id="poolFoto1" type="text">
                </div>
                <div class="form-group">
                    <label for="poolParaderoInicio">Paradero Inicio:</label>
                    <input id="poolParaderoInicio" type="text" placeholder="Paradero Inicio">
                </div>
                <div class="form-group">
                    <label for="poolParaderoLlegada">Paradero Llegada:</label>
                    <input id="poolParaderoLlegada" type="text" placeholder="Paradero Llegada">
                </div>
                <button class="button-colectivo" type="submit">Registra tu vehículo</button>
            </fieldset>
        </form>

    </section>
    <footer>
        <img src="../img/img_footer.png" alt="Redes sociales" class="img-footer" />
        <p>© 2024 Johel Cueva - Michael Limaco. Todos los derechos reservados.</p>
        <div class="contenedor-footer">
            <a class="item" href="#">Políticas de privacidad</a>
            <a class="item" href="#">Términos del servicio</a>
            <a class="item" href="#">Contáctanos</a>
        </div>
    </footer>
    <script src="../js/formColectivo.js"></script>
</body>

</html>
